name: Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 and Build Release APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle assembleRelease

      - name: Generate Keystore & Sign Release APK
        run: |
          keytool -genkey -v -keystore royal-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias royalkey -storepass Royal@1234 -keypass Royal@1234 -dname "CN=Pro Trading Studio, OU=Games, O=Pro Trading Studio, L=Aligarh, ST=UP, C=IN"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks royal-release.jks --ks-key-alias royalkey --ks-pass pass:Royal@1234 --key-pass pass:Royal@1234 --out app-release-signed.apk app-release-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Holdem-Signed-Release-APK
          path: app-release-signed.apk
