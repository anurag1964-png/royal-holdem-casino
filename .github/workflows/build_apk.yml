name: Build Royal Holdem APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Ensure Android Project Files
        run: |
          mkdir -p app/src/main/java/com/playzonestudio/royalholdem app/src/main/assets
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Royal Holdem Casino"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/playzonestudio/royalholdem/MainActivity.java
          package com.playzonestudio.royalholdem;
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;

          public class MainActivity extends AppCompatActivity implements IUnityAdsInitializationListener {
              private static final String UNITY_GAME_ID = "80043681";
              private static final String REWARDED_PLACEMENT_ID = "Rewarded_Android";
              private static final String INTERSTITIAL_PLACEMENT_ID = "Interstitial_Android";
              private static final boolean TEST_MODE = false;
              private WebView webView;
              private boolean isRewardedReady = false;
              private boolean isInterstitialReady = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new UnityAdsBridge(), "AndroidUnityAds");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectSmartAdHooks();
                      }
                  });
                  UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, TEST_MODE, this);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void injectSmartAdHooks() {
                  String js = "(function() {" +
                          "  if (window._unityHooked) return;" +
                          "  window._unityHooked = true;" +
                          "  window._pendingRewardBtn = null;" +
                          "  window.onUnityAdRewardEarned = function() {" +
                          "    if (window._pendingRewardBtn) {" +
                          "      var btn = window._pendingRewardBtn;" +
                          "      window._pendingRewardBtn = null;" +
                          "      btn.dataset.unityBypass = '1';" +
                          "      btn.click();" +
                          "    }" +
                          "  };" +
                          "  document.addEventListener('click', function(e) {" +
                          "    var target = e.target;" +
                          "    while (target && target !== document.body) {" +
                          "      if (target.dataset && target.dataset.unityBypass === '1') {" +
                          "        delete target.dataset.unityBypass;" +
                          "        return;" +
                          "      }" +
                          "      var txt = (target.innerText || target.textContent || '').toUpperCase();" +
                          "      if (txt.includes('WATCH VIDEO') || txt.includes('FREE 6.00M') || txt.includes('FREE CHIPS')) {" +
                          "        if (window.AndroidUnityAds) {" +
                          "          e.stopImmediatePropagation();" +
                          "          e.preventDefault();" +
                          "          window._pendingRewardBtn = target;" +
                          "          window.AndroidUnityAds.showRewardedAd();" +
                          "          return;" +
                          "        }" +
                          "      }" +
                          "      target = target.parentElement;" +
                          "    }" +
                          "  }, true);" +
                          "})();";
                  webView.evaluateJavascript(js, null);
              }

              @Override
              public void onInitializationComplete() {
                  loadRewardedAd();
                  loadInterstitialAd();
              }

              @Override
              public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {}

              private void loadRewardedAd() {
                  UnityAds.load(REWARDED_PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override public void onUnityAdsAdLoaded(String placementId) { isRewardedReady = true; }
                      @Override public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) { isRewardedReady = false; }
                  });
              }

              private void loadInterstitialAd() {
                  UnityAds.load(INTERSTITIAL_PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override public void onUnityAdsAdLoaded(String placementId) { isInterstitialReady = true; }
                      @Override public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) { isInterstitialReady = false; }
                  });
              }

              public class UnityAdsBridge {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(() -> {
                          if (isRewardedReady) {
                              isRewardedReady = false;
                              UnityAds.show(MainActivity.this, REWARDED_PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      Toast.makeText(MainActivity.this, "Ad loading, please try again...", Toast.LENGTH_SHORT).show();
                                      loadRewardedAd();
                                  }
                                  @Override public void onUnityAdsShowStart(String placementId) {}
                                  @Override public void onUnityAdsShowClick(String placementId) {}
                                  @Override public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                          webView.evaluateJavascript("if(window.onUnityAdRewardEarned){window.onUnityAdRewardEarned();}", null);
                                      }
                                      loadRewardedAd();
                                  }
                              });
                          } else {
                              Toast.makeText(MainActivity.this, "Loading Video Ad... Click again in 3 seconds", Toast.LENGTH_SHORT).show();
                              loadRewardedAd();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitialAd() {
                      runOnUiThread(() -> {
                          if (isInterstitialReady) {
                              isInterstitialReady = false;
                              UnityAds.show(MainActivity.this, INTERSTITIAL_PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) { loadInterstitialAd(); }
                                  @Override public void onUnityAdsShowStart(String placementId) {}
                                  @Override public void onUnityAdsShowClick(String placementId) {}
                                  @Override public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) { loadInterstitialAd(); }
                              });
                          } else { loadInterstitialAd(); }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); }
                  else { super.onBackPressed(); }
              }
          }
          EOF
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Holdem-Casino-UnityAds-APK
          path: app/build/outputs/apk/debug/app-debug.apk
